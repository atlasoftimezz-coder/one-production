[project]
name = "one-production"
version = "0.4.0"
description = "Local production studio: chat, accounts, usage, handoff, voiceover."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-multipart",
    "httpx",
    "keyring",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
